# Atlas plate 5198 (README §3, §4). One atlas hex = one page.
# Terrain lives here as a compact grid: a default plus per-subhex
# overrides keyed by subhex number. Rich per-hex content (features,
# names, chronicle) lives in hexes/5198-NNN.yaml.
#
# Created as a full-ocean plate (WORLDGEN §4-B): no interior was rolled,
# every subhex is the default terrain, and depth/current are recorded
# below instead of 157 near-identical subhex records.

id: "5198"
continent_hex: 37            # the 432-mile hex this plate sits within
name: "Plate 5198"
title: "Plate 5198"
scale_label: "1 HEX = 3 MILES (1 LEAGUE)"
summary: >
  Newly surveyed ground; no account of it has been written yet.

# Six adjoining plates (README §3). null = not yet created.
neighbors:
  e: "5201"
  ne: "5203"
  nw: "5206"
  w: "5211"
  sw: "5196"
  se: "5194"

default_terrain: ocean
fill: ocean
depth: deep
terrain:                     # subhex number -> terrain type (non-default only)

# Line features (README §4): paths crossing subhexes, not per-hex fills.
lines:
