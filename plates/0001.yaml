# Atlas plate 0001 (README §3, §4). One atlas hex = one page.
# Terrain lives here as a compact grid: a default plus per-subhex
# overrides keyed by subhex number. Rich per-hex content (features,
# names, chronicle) lives in hexes/0001-NNN.yaml.

id: "0001"
continent_hex: 1            # the 432-mile hex this plate sits within
name: "Central Harrow"
canton: Harrow
realm: Karvosia
title: "Central portion of Harrow Canton, Karvosia"
scale_label: "1 HEX = 3 MILES (1 LEAGUE)"
summary: >
  The heart of Harrow canton: a lake-country of plains and low hills
  about the town of Merrowgate, hemmed by forest and high ground.

