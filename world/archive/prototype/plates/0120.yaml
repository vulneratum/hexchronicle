  Newly surveyed ground; no account of it has been written yet.

# Six adjoining plates (README §3). null = not yet created.
neighbors:
  e: "0123"
  ne: "0122"
  nw: "0119"
  w: "0105"
  sw: "0121"
  se: "0124"

default_terrain: plains
terrain:                     # subhex number -> terrain type (non-default only)
  "003": swamp

