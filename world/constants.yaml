# world/constants.yaml — ONE set of constants, read by the generator and by the
# living-world tick, so the world and its future never drift apart (WORLDGEN §6).
#
# Nothing in here is history. These are game constants and settled geometry.
# Anything a later phase computes belongs in world/physical/, world/economy/, …

# ---------------------------------------------------------------- determinism
# Every generated value derives from this seed plus the hex address (§0).
# Re-running generation on an ungenerated plate must reproduce it exactly.
world_seed: "hexchronicle-4712"
seed_uint32: 530816148          # FNV-1a of world_seed; recorded so a change is loud

# ---------------------------------------------------------------- geometry
# Frozen by README §2. Worldgen writes values INTO hexes; it never changes which
# hexes exist or what they are called.
scales:
  subhex_miles: 3               # one league — the unit of play
  plate_miles: 36               # the atlas hex
  continent_hex_miles: 432
  subhexes_per_plate: 157
  plate_span_subhexes: 12       # a plate offset is exactly 12 subhex steps

frame:
  cols: 36
  rows: 36
  plates: 1296                  # ids 0001–1296, row-major from the top-left (§4-A)
  # OFFSET-AXIAL layout. A raw q,r ∈ [0,35] block is a rhombus sheared 30° —
  # ~1,890 miles across the top against 1,133 tall, which contradicts §1's
  # "1,296 miles edge to edge, in both directions". Row r therefore spans
  # q ∈ [-floor(r/2), 35-floor(r/2)], which shears it back upright.
  layout: offset-axial
  # True extent. A hex row advances 0.866 of a hex width, so 36×36 plates is
  # inherently ~16% wider than tall; §1's "1,296 × 1,296 miles" treats plates as
  # squares. The plate COUNT is exactly as §1 specifies.
  width_miles: 1314
  height_miles: 1133
  # Unique subhex positions. §1's 203,472 (= 1,296 × 157) double-counts the
  # 16,275 seam positions that two or three plates share (README §2).
  subhexes_unique: 187197
  subhexes_seam_shared: 16275

# ---------------------------------------------------------------- climate band
# Settled: Atlantic to Mediterranean (§1a). Northern Scotland at the top edge,
# Andalusia and Sicily at the bottom. Latitude is linear in frame v.
#
# NOTE: 20° of latitude over 1,133 miles puts a degree at ~57 miles rather than
# Earth's ~69. The band is a CLIMATE specification, not an Earth mapping — its
# purpose is that players already have intuitions for it — so the stated
# endpoints are kept and the world's degree is simply shorter.
latitude:
  north: 56
  south: 36
  prevailing_wind: westerly     # west → east across the whole frame (§VII-D)

climate_modes: [atlantic_west, mediterranean_south, continental_east]

# Seasonality is a first-class field (§VII-D2). The two halves of the map close
# in OPPOSITE seasons: the north and uplands in winter, the south in summer
# drought. Per-region values are computed in Phase A and recorded there; these
# are the band-level defaults the tick falls back on.
seasons:
  atlantic_west:
    growing_season_days: 250
    pass_closure_months: []
    low_water_months: []
    yield_modifier: 1.00
  mediterranean_south:
    growing_season_days: 275
    pass_closure_months: []
    low_water_months: [6, 7, 8, 9]      # summer drought: mills stop, rivers drop
    yield_modifier: 0.90                # rain-fed; irrigation is the political lever
  continental_east:
    growing_season_days: 200
    pass_closure_months: [12, 1, 2]
    low_water_months: [1, 2]            # ice, not drought
    yield_modifier: 0.95
  alpine:
    growing_season_days: 120
    pass_closure_months: [11, 12, 1, 2, 3, 4]
    low_water_months: []
    yield_modifier: 0.55

# ---------------------------------------------------------------- logistics
# §6. Used by the caloric ceiling (§IX) and the wilderness tax (§VIII-A).
logistics:
  ox_consumption_per_50_miles: 0.10     # fraction of cargo eaten by the team
  bulk_trade_radius_miles: 60           # = 20 subhexes; past this, bulk grain needs water
  bulk_trade_radius_subhexes: 20
  water_transport_multiplier: 8         # a ton-mile by water against by ox-cart
  farmer_fraction: [0.80, 0.95]
  temperate_lowland_yield: 4            # 4:1 return on seed
  sailing_speed_miles_per_day:
    summer: 75
    winter: 45                          # shorter days, worse weather, coast-hugging

# ---------------------------------------------------------------- land–sea mask
# Phase A step 1. The field is analytic and the subhex lattice samples it, so
# neighbouring plates agree along their seam with no special-casing (§VII).
# Full parameter set and the RLE'd result: world/physical/land-sea-mask.json
land_sea:
  # THE RING WINS OVER THE WATER TARGET. Asked for ~40%; the varying margin plus
  # the channel land it at 44%, which is the stated fallback — land at 56%
  # (817,100 sq mi) is still inside the Europe band.
  target_water_fraction: 0.44
  actual_water_fraction: 0.4400
  land_sq_mi: 817100
  frame_sq_mi: 1459056

  # THE OCEAN RING (rules 11 and 11a). Width is itself a noise field along the
  # perimeter, so the margin is never a traceable contour. Two mechanisms:
  # an unbounded HARD penalty inside one plate, which alone guarantees rule 11,
  # and a SOFT ramp out to the varying width, which is what the coast actually
  # settles against.
  ring:
    min_plates: 1.0                     # rule 11 floor — never breached
    target_min_plates: 1.85             # the soft ring binds here, clear of the
                                        # hard guard, whose contour is a straight
                                        # line and pinned 144 miles of coast to it
    target_max_plates: 5.0
    measured_plates: { min: 1.01, p10: 1.32, median: 2.14, mean: 2.70, p90: 5.33, max: 7.93, sd: 1.54 }
    # 64 of 750 probe rays travel further than 8 plates before finding land.
    # Those enter a strait or the southern sea; they are openings, not margin,
    # and are excluded from the statistics above.
    opening_rays: 64

  # TWO MASSES, divided by an EAST–WEST channel across the north.
  northern_mass_sq_mi: 186048
  main_mass_sq_mi: 621940
  channel:
    orientation: east-west, across the north
    kind: through-passage                # open ocean at BOTH ends, therefore salt
    pinch_subhexes: 10                   # bank to bank, 30 miles — the chokepoint
    pinch_at_u: 0.89
    widest_subhexes: 46                  # 138 miles, at the western mouth
    widest_at_u: 0.11

  # THE DROWNED RIDGE — the broken land bridge, and the archipelago's cause
  # (§VII-B: every chain gets a geological cause). The swell contributes only
  # bathymetry and never surfaces; discrete seamounts standing on it are the
  # islands. A single continuous crest tuned to just break the surface comes out
  # as a BAR down the middle of the channel rather than a chain.
  archipelago:
    cause: drowned ridge — remnant of the land bridge whose collapse split the masses
    placed_at: the channel's narrow EASTERN end, so the stepping stones and the
      chokepoint are the same place
    islands: 8
    over_300_sq_mi: 4                   # 896, 366, 351, 312
    scatter_sq_mi: [210, 101, 23, 23]
    shelf_subhexes: 2619                # shallow water around the chain (§VII-B)

  # ORGANIC COASTLINES (§VII-A2). High-frequency octaves are injected in a BAND
  # around the threshold — full strength where the field is near sea level,
  # nothing inland or offshore. Applied globally they would pit the interior with
  # lakes and freckle the deep ocean with islands.
  coastal_detail:
    amplitude: 0.88
    frequency: 105                      # ≈ 12.5 miles per cycle; octaves reach
                                        # below one subhex
    octaves: 4
    gain: 0.72
    band: 0.65                          # gaussian width around the threshold
  shoreline_development_index:          # coast length ÷ equal-area circle
    northern: 6.66
    main: 9.10
    target: 3.0
  # Longest run the shoreline advances in ONE hex direction. §VII-A2 caps it at
  # 6 subhexes; 3 runs of 7 survive out of 20,569 shoreline steps. See the note
  # in tools/validate-world.js — a random walk would produce roughly 28.
  longest_shoreline_run_subhexes: 7
  runs_over_cap: 3

  min_island_subhexes: 12               # smaller is noise, not a landform (§VII-B)
  min_island_subhexes_in_channel: 3     # …except on the ridge, where a scatter of
                                        # small islands is the expected form of a
                                        # broken land bridge
  min_lake_subhexes: 25                 # smaller is noise, not a closed basin (§VII-E)
  # `water` vs `ocean` is fresh vs salt, decided by CONNECTIVITY to the world
  # ocean, never by size (§VII-G, validation rule 14).
  salt_rule: connected-to-world-ocean

# ---------------------------------------------------------------- elevation
# Phase A step 2. Every subhex carries an integer `elevation` in FEET (negative
# for bathymetry) and a `relief` class. G1 writes both BEFORE terrain, because
# §VII-G resolves terrain from (temperature × moisture × elevation × drainage)
# and reads elevation as an input.
#
# Full parameters and the encoded per-subhex data: world/physical/elevation.json
elevation:
  units: feet
  # RELIEF IS RANGE, NOT HEIGHT — the local elevation spread within 2 subhexes
  # (6 miles). A high plateau is `flat`; low broken country is `hills`. That is
  # the distinction the biome matrix needs, and absolute height cannot express it.
  relief_radius_subhexes: 2
  relief_bands_ft:
    flat: 250            # local range under this
    rolling: 800
    hills: 2000
    mountains: null      # anything above
  measured:
    land: { min: 1, median: 617, p90: 3383, p99: 10923, max: 13485, mean: 1241 }
    sea:  { shallowest: -1, median: -294, deepest: -15883, mean: -1387 }
    relief_land_pct: { flat: 20.8, rolling: 58.3, hills: 13.8, mountains: 7.2 }
    above_8500ft_subhexes: 2197        # §1a's alpine glacier and tundra need this

  # OROGENY IS EXPLICIT (§VII-C). Sampling the continentality field alone gives
  # a smooth dome: relief would be flat or rolling everywhere, nothing would
  # qualify as mountains, and the alpine zone would have nowhere to exist.
  # Ranges are LINES with asymmetric foothills.
  ranges:
    - name: western cordillera
      peak_ft: 7800
      cause: coastal collision range; the rain shadow east of it is what §1a's
        badlands and desert require, since the westerlies need a north-south barrier
    - name: the great spine
      peak_ft: 13600
      cause: the principal collision spine; the only ground above the snowline
    - name: northern uplands
      peak_ft: 5200
      cause: an older eroded range on the northern mass; §1a puts taiga in
        northern upland and nowhere else
    - name: eastern escarpment
      peak_ft: 3800
      cause: trailing-margin shoulder (§VII-C), not a collision — low and one-sided

  # The base is read from the PRE-DETAIL field (h0). The §VII-A2 coastal detail
  # exists to perturb the land/sea boundary at the subhex scale and is not
  # topography; reading it here put ~1,300 ft of spurious relief along every
  # shoreline and left the continent with 41 flat subhexes in total.
  base_reads_field: h0
  # Regional swell at the 100-300 mile scale. Without it the base saturates near
  # its ceiling and the interior is one flat expanse — four ridges on a billiard
  # table. This is the scale at which watersheds become distinguishable, so
  # drainage depends on it.
  regional_swell_ft: 980

# ---------------------------------------------------------------- NOT YET SET
# Both of these are required before Phase G1 can write a single terrain value,
# and both are deliberately absent rather than guessed:
#
#   biome_matrix        (temperature band × moisture band) → terrain id, with
#                       elevation and drainage as overrides (§VII-G).
#   terrain_table       one row per each of the 15 palette types: arable
#                       fraction, yield ratio, fuelwood, movement cost, hazard
#                       multiplier (§6). A missing row is a silent wrong answer
#                       rather than an error, so validation rule 13 checks it.
#
# They cannot be written yet: both classify the temperature and moisture fields,
# which are computed AFTER the land–sea mask is approved. Writing them now would
# be painting biomes first and rationalising after, which §VII-G forbids
# outright. They land at the end of Phase A, before G1.
